<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Festival Discovery</title>
    <script>
        // Load config and redirect to default festival
        async function loadDefaultFestival() {
            try {
                const response = await fetch('config.json');
                const config = await response.json();
                const defaultPath = config.defaultFestival;

                // Redirect to default festival
                window.location.href = defaultPath;
            } catch (error) {
                console.error('Error loading config:', error);
                document.body.innerHTML = '<h1>Error loading festival data</h1>';
            }
        }

        loadDefaultFestival();
    </script>
</head>
<body>
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: 'Caveat', cursive; font-size: 2em;">
        <p>Loading festival...</p>
    </div>
</body>
</html>
